<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.1 Unit 6 Dress right Vocab Game</title>
    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Script สำหรับส่งคะแนน (ปรับ URL ให้ตรงกับ Repo ของคุณหากจำเป็น) -->
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    
    <style>
        :root {
            --main-theme: #3b82f6; --dark-theme: #1d4ed8; --accent-theme: #f59e0b;
            --shadow-3d: rgba(59, 130, 246, 0.15);
        }
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f9ff; color: #334155; margin: 0; padding: 15px; }
        h1 { font-family: 'Fredoka One', cursive; color: var(--main-theme); text-align: center; font-size: 26px; margin-bottom: 5px; }
        h2 { text-align: center; color: #64748b; font-size: 16px; margin-top: 0; margin-bottom: 20px; }
        
        .app-container { max-width: 500px; margin: 0 auto; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        
        /* Profile Bar */
        .profile-bar {
            font-size: clamp(12px, 3.5vw, 14px); background: #dbeafe; border: 2px solid #93c5fd;
            padding: 8px 15px; border-radius: 20px; color: var(--dark-theme); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin: 0 auto 20px auto; max-width: 500px;
        }
        .btn-switch { background: #fca5a5; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; transition: 0.2s;}
        .btn-switch:hover { background: #ef4444; }

        /* Game UI */
        .choice-btn { width: 100%; text-align: left; background: #f8fafc; border: 2px solid #e2e8f0; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .choice-btn:hover { background: #eff6ff; border-color: var(--main-theme); }
        .choice-btn.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
        .choice-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .choice-btn:disabled { cursor: not-allowed; }
        
        .audio-btn { background: var(--main-theme); color: white; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 24px; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; cursor: pointer; box-shadow: 0 4px 10px var(--shadow-3d); }
        .audio-btn:active { transform: scale(0.95); }
        .vocab-display { font-family: 'Fredoka One', cursive; font-size: 32px; text-align: center; color: #1e293b; margin-bottom: 20px; }
        .progress-text { text-align: center; font-weight: 600; color: #64748b; margin-bottom: 15px; }
        
        .primary-btn { width: 100%; background: var(--main-theme); color: white; font-weight: 800; font-size: 18px; padding: 15px; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 var(--dark-theme); }
        .primary-btn:active { transform: translateY(4px); box-shadow: none; }
        
        .table-container { max-height: 250px; overflow-y: auto; margin-bottom: 20px; border: 1px solid #e2e8f0; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background: #f1f5f9; font-weight: bold; position: sticky; top: 0; }
        .mistake-row { color: #ef4444; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240,249,255,0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: opacity 0.3s; padding: 15px; box-sizing: border-box; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 30px; text-align: center; width: 100%; max-width: 340px; border: 4px solid var(--main-theme); box-shadow: 8px 12px 25px var(--shadow-3d); box-sizing: border-box; }
        .modal-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #bfdbfe; border-radius: 15px; text-align: center; font-family: 'Sarabun'; font-size: 16px; font-weight: 600; box-sizing: border-box; outline: none; }
        .modal-box input:focus { border-color: var(--main-theme); }
        .btn-action { width: 100%; padding: 14px; background: var(--main-theme); color: white; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; font-family: 'Sarabun'; box-shadow: 0 4px 0 var(--dark-theme); transition: 0.1s; font-size: 17px; }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }
        .score-num { font-size: 55px; font-weight: 900; color: var(--dark-theme); margin: 10px 0; display: block; }
    </style>
</head>
<body>

    <!-- Profile Bar -->
    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับ</button>
    </div>

    <div class="app-container">
        <h1>Vocab Game</h1>
        <h2>ม.1 Unit 6 Dress right Vocab - Clothes - Accessories</h2>

        <!-- หน้าเริ่มเกม (Start Screen) -->
        <div id="startScreen" style="text-align: center; padding: 20px 0;">
            <div style="font-size: 60px; margin-bottom: 20px;">🎮</div>
            <p style="font-size: 16px; color: #475569; margin-bottom: 30px;">
                แบบทดสอบคำศัพท์ 24 ข้อ<br>ตอบถูกได้คะแนน ตอบผิดมีเฉลยให้ดู!
            </p>
            <button class="primary-btn" onclick="initQuizFlow()">🚀 เริ่มทำแบบทดสอบ</button>
        </div>

        <!-- หน้าเล่นเกม (Quiz Screen) -->
        <div id="quizScreen" class="hidden">
            <div class="progress-text" id="progressText">ข้อ 1 / 24</div>
            <button class="audio-btn" onclick="playVocabAudio()">🎧</button>
            <div class="vocab-display" id="vocabText">Word</div>
            <div id="choicesContainer"></div>
        </div>

        <!-- หน้าสรุปผล (Result Screen - ตารางคำผิด) -->
        <div id="resultScreen" class="hidden">
            <h3 style="font-size: 18px; color: var(--dark-theme); margin-bottom: 10px; text-align: center;">ตารางสรุปคำศัพท์ที่ตอบผิด</h3>
            <div class="table-container">
                <table id="mistakeTable">
                    <thead>
                        <tr>
                            <th>คำศัพท์</th>
                            <th>คำแปลที่ถูกต้อง</th>
                        </tr>
                    </thead>
                    <tbody id="mistakeBody"></tbody>
                </table>
            </div>
            <button class="primary-btn" style="background: var(--accent-theme); box-shadow: 0 4px 0 #b45309;" onclick="resetToStart()">🔄 เริ่มทำใหม่</button>
        </div>
    </div>

    <!-- Modals -->
    <!-- Modal: ลงทะเบียน -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 id="modalTitle" style="color:var(--dark-theme); margin-top:0; font-size: 24px;">📝 ลงชื่อเข้าเรียน</h2>
            <p id="modalSub" style="color: #6b7280; font-weight: 600; margin-top: 0; display:none; font-size: 14px;"></p>
            <input type="text" id="in_name" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-action" onclick="confirmUser()">✅ ยืนยันข้อมูล</button>
        </div>
    </div>

    <!-- Modal: ส่งคะแนน -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-theme); margin-top:0; font-size: 26px;">🎉 ทำแบบทดสอบเสร็จแล้ว!</h2>
            <p style="color: #6b7280; font-weight: 600;">คะแนนของคุณคือ</p>
            <span class="score-num"><span id="finalScoreText">0</span> / 24</span>
            <div id="saveStatus" style="font-weight:bold; font-size:15px; margin-bottom:15px; color:#15803d;"></div>
            <button id="viewResultBtn" class="btn-action" onclick="closeScoreModal()" style="display:none;">🔍 ดูข้อที่ผิด</button>
        </div>
    </div>

    <!-- เสียงเอฟเฟกต์ -->
    <audio id="sfxCorrect" src="correct.mp3"></audio>
    <audio id="sfxWrong" src="wrong.mp3"></audio>
    <audio id="vocabAudio" src=""></audio>

    <script>
        const TOPIC_NAME = 'ม.1 Unit 6 Dress right Vocab - Clothes - Accessories';
        const vocabData = [
            { word: "T-shirt", thai: "เสื้อยืด", audio: "T-shirt.mp3" },
            { word: "shorts", thai: "กางเกงขาสั้น", audio: "shorts.mp3" },
            { word: "socks", thai: "ถุงเท้า", audio: "socks.mp3" },
            { word: "trainers", thai: "รองเท้าผ้าใบ / รองเท้ากีฬา", audio: "trainers.mp3" },
            { word: "blouse", thai: "เสื้อสตรี", audio: "blouse.mp3" },
            { word: "jacket", thai: "เสื้อแจ็คเก็ต", audio: "jacket.mp3" },
            { word: "skirt", thai: "กระโปรง", audio: "skirt.mp3" },
            { word: "shoes", thai: "รองเท้า", audio: "shoes.mp3" },
            { word: "shirt", thai: "เสื้อเชิ้ต", audio: "shirt.mp3" },
            { word: "suit", thai: "ชุดสูท", audio: "suit.mp3" },
            { word: "tie", thai: "เนคไท", audio: "tie.mp3" },
            { word: "raincoat", thai: "เสื้อกันฝน", audio: "raincoat.mp3" },
            { word: "dress", thai: "ชุดเดรส", audio: "dress.mp3" },
            { word: "gloves", thai: "ถุงมือ", audio: "gloves.mp3" },
            { word: "scarf", thai: "ผ้าพันคอ", audio: "scarf.mp3" },
            { word: "jeans", thai: "กางเกงยีนส์", audio: "jeans.mp3" },
            { word: "boots", thai: "รองเท้าบูท", audio: "boots.mp3" },
            { word: "light", thai: "บาง, น้ำหนักเบา", audio: "light.mp3" },
            { word: "loose", thai: "หลวม, ไม่รัดรูป", audio: "loose.mp3" },
            { word: "warm", thai: "อบอุ่น, ให้ความอบอุ่น", audio: "warm.mp3" },
            { word: "How do I look in this?", thai: "ฉันใส่ชุดนี้/ตัวนี้แล้วดูเป็นไงบ้าง?", audio: "How_do_I_look_in_this.mp3" },
            { word: "That looks terrible on you.", thai: "ชุดนั้นเธอใส่แล้วดูแย่มาก / ไม่เข้ากับเธอเลย", audio: "That_looks_terrible_on_you.mp3" },
            { word: "What do you think of my ...?", thai: "เธอคิดยังไงกับ ... ของฉัน?", audio: "What_do_you_think_of_my.mp3" },
            { word: "You look great/lovely.", thai: "เธอดูดีมาก / ดูน่ารักมากเลย", audio: "You_look_great_lovely.mp3" }
        ];

        const MAX_Q = vocabData.length;
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let mistakes = [];
        let isSwitchingAccount = false;
        let isWaitingToStart = false; // Flag สำหรับเช็คว่าเพิ่งกรอกข้อมูลเสร็จและต้องเริ่มเกมทันทีหรือไม่

        window.onload = () => { checkLoginStatus(); };

        // ---------------- AUTH & PROFILE SYSTEM ---------------- //
        function checkLoginStatus() {
            if(localStorage.getItem('studentId')) {
                document.getElementById('userProfile').style.display = 'flex';
                document.getElementById('p_name').innerText = localStorage.getItem('studentName');
                document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
                document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
            } else {
                document.getElementById('userProfile').style.display = 'none';
            }
        }

        document.getElementById('in_room').addEventListener('blur', function() {
            let nums = this.value.match(/\d+/g);
            if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
            else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
        });

        function switchAccount() {
            Swal.fire({
                title: '⚠️ เปลี่ยนคนเล่น?', text: "ข้อมูลเดิมจะถูกสลับออกนะ", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#1d4ed8', cancelButtonColor: '#9ca3af',
                confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก'
            }).then((res) => {
                if(res.isConfirmed) {
                    localStorage.clear(); 
                    isSwitchingAccount = true;
                    document.getElementById('in_name').value = ''; 
                    document.getElementById('in_room').value = ''; 
                    document.getElementById('in_id').value = '';
                    document.getElementById('modalTitle').innerText = "🔄 ลงชื่อบัญชีใหม่";
                    document.getElementById('modalSub').innerText = "กรอกข้อมูลเพื่อเล่นต่อ";
                    document.getElementById('modalSub').style.display = 'block';
                    checkLoginStatus(); 
                    document.getElementById('loginModal').classList.add('active');
                }
            });
        }

        function confirmUser() {
            let n = document.getElementById('in_name').value.trim();
            let r = document.getElementById('in_room').value.trim();
            let id = document.getElementById('in_id').value.trim();
            
            if(!n || !r || id.length !== 5) { 
                Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัส 5 หลัก', 'warning'); 
                return; 
            }
            
            localStorage.setItem('studentName', n); 
            localStorage.setItem('studentRoom', r); 
            localStorage.setItem('studentId', id);
            
            document.getElementById('loginModal').classList.remove('active'); 
            checkLoginStatus();

            isSwitchingAccount = false;
            
            // ถ้ารอเริ่มเกมอยู่ ให้ลุยเลย
            if (isWaitingToStart) {
                isWaitingToStart = false;
                startQuizCore();
            }
        }

        // ---------------- QUIZ SYSTEM ---------------- //
        function initQuizFlow() {
            if(!localStorage.getItem('studentId')) {
                // ถ้ายังไม่มีข้อมูล ให้เด้ง Modal สมัครก่อน
                isWaitingToStart = true;
                document.getElementById('modalTitle').innerText = "👋 ยินดีต้อนรับ!";
                document.getElementById('modalSub').innerText = "กรอกข้อมูลเพื่อเข้าสู่บทเรียน";
                document.getElementById('modalSub').style.display = 'block';
                document.getElementById('loginModal').classList.add('active');
            } else {
                startQuizCore();
            }
        }

        function startQuizCore() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            
            score = 0;
            mistakes = [];
            currentQuestions = [...vocabData].sort(() => 0.5 - Math.random());
            currentIndex = 0;
            
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= currentQuestions.length) {
                finishQuiz();
                return;
            }

            const q = currentQuestions[currentIndex];
            document.getElementById('progressText').innerText = `ข้อ ${currentIndex + 1} / ${MAX_Q}`;
            document.getElementById('vocabText').innerText = q.word;
            
            document.getElementById('vocabAudio').src = q.audio;
            playVocabAudio();

            let choices = [q.thai];
            let distractors = vocabData.map(v => v.thai).filter(t => t !== q.thai).sort(() => 0.5 - Math.random());
            choices.push(distractors[0], distractors[1], distractors[2]);
            choices.sort(() => 0.5 - Math.random());

            const container = document.getElementById('choicesContainer');
            container.innerHTML = '';
            choices.forEach(choiceText => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choiceText;
                btn.onclick = () => checkAnswer(btn, choiceText, q);
                container.appendChild(btn);
            });
        }

        function playVocabAudio() {
            const audio = document.getElementById('vocabAudio');
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Audio not found"));
        }

        function checkAnswer(btn, selected, q) {
            const allBtns = document.querySelectorAll('.choice-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selected === q.thai) {
                btn.classList.add('correct');
                document.getElementById('sfxCorrect').play();
                score++;
            } else {
                btn.classList.add('wrong');
                document.getElementById('sfxWrong').play();
                mistakes.push(q);
                allBtns.forEach(b => {
                    if (b.innerText === q.thai) b.classList.add('correct');
                });
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1200); // ดีเลย์ 1.2 วินาทีเพื่อไปยังข้อถัดไป
        }

        // ---------------- FINISH & SUBMIT SYSTEM ---------------- //
        function finishQuiz() {
            // ซ่อนหน้าจอคำถาม และเตรียมแสดงหน้าจอสรุป
            document.getElementById('quizScreen').classList.add('hidden');
            
            // สร้างตารางคำผิดเตรียมไว้
            const tbody = document.getElementById('mistakeBody');
            tbody.innerHTML = '';
            if (mistakes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#22c55e; font-weight:bold;">เก่งมาก! ตอบถูกทุกข้อเลย 🎉</td></tr>';
            } else {
                mistakes.forEach(m => {
                    tbody.innerHTML += `<tr class="mistake-row"><td>${m.word}</td><td>${m.thai}</td></tr>`;
                });
            }

            // ส่งคะแนนและเด้ง Modal สรุปผลทันที
            submitScoreAPI();
        }

        function submitScoreAPI() {
            document.getElementById('scoreModal').classList.add('active');
            document.getElementById('finalScoreText').innerText = score;
            const stat = document.getElementById('saveStatus');
            const viewResultBtn = document.getElementById('viewResultBtn');

            if(typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
                stat.innerText = "❌ ไม่พบไฟล์ตั้งค่าการเชื่อมต่อ (quiz-config.js)"; 
                viewResultBtn.style.display = 'block'; 
                return;
            }

            stat.innerText = "⏳ กำลังส่งคะแนน...";
            stat.style.color = "var(--dark-theme)";
            viewResultBtn.style.display = 'none';

            const payload = {
                name: localStorage.getItem('studentName'), 
                room: localStorage.getItem('studentRoom'),
                studentId: "'" + localStorage.getItem('studentId'), 
                lesson: TOPIC_NAME, 
                score: score, 
                maxScore: MAX_Q
            };

            // ส่งข้อมูลไปยัง Google Sheets (ไม่ต้องรอให้เสร็จเพื่อไม่ให้บล็อก UI)
            fetch(QUIZ_CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
                .catch(e => console.error(e));

            // จำลองว่าส่งเสร็จใน 2 วินาทีเพื่อให้เห็น Animation
            setTimeout(() => {
                stat.innerText = "✅ บันทึกคะแนนลงระบบเรียบร้อย!"; 
                stat.style.color = "#15803d";
                viewResultBtn.style.display = 'block';
            }, 2000);
        }

        function closeScoreModal() {
            // ปิด Modal และแสดงหน้าจอ Result (ตารางคำผิด)
            document.getElementById('scoreModal').classList.remove('active');
            document.getElementById('resultScreen').classList.remove('hidden');
        }

        function resetToStart() {
            // กลับไปหน้า Start Screen
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
