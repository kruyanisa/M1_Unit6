<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sounds great! Suggest or Respond</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    
    <style>
        :root { --main: #f97316; --dark: #c2410c; }
        body { 
            font-family: 'Sarabun', sans-serif; 
            margin: 0; padding: 15px; 
            background: #fff7ed;
            min-height: 100vh;
        }
        
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        
        h1 { font-family: 'Fredoka One', cursive; color: white; background: var(--main); text-align: center; font-size: 24px; margin: 0 -20px 20px -20px; padding: 15px; border-radius: 20px 20px 0 0; border-bottom: 4px solid var(--dark); text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        
        .profile-bar { font-size: 14px; background: #ffedd5; border: 2px solid #fdba74; padding: 8px 15px; border-radius: 20px; color: var(--dark); font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; }
        .btn-switch { background: #fb923c; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        .instruction { font-size: 16px; font-weight: 800; color: #1e3a8a; text-align: center; margin-bottom: 25px; padding: 10px; background: #eff6ff; border-radius: 12px; border: 2px dashed #93c5fd; }

        /* Question List */
        .question-row {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 15px;
            border-bottom: 2px solid #f3f4f6;
            transition: 0.3s;
        }
        .question-row:last-child { border-bottom: none; }
        .question-row:hover { background-color: #fafaf9; }
        .question-row.disabled { opacity: 0.6; pointer-events: none; background-color: #f3f4f6; border-radius: 12px; }
        
        @media (min-width: 640px) {
            .question-row { flex-direction: row; align-items: center; justify-content: space-between; }
        }

        .sentence-group { display: flex; align-items: center; gap: 12px; flex: 1; }
        
        .play-btn {
            background: #fed7aa;
            border: 2px solid #f97316;
            color: #c2410c;
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 18px; cursor: pointer; transition: 0.1s; flex-shrink: 0;
        }
        .play-btn:active { transform: scale(0.9); }
        .play-btn.playing { background: #f97316; color: white; animation: pulse 1s infinite; }
        
        .sentence-text { font-size: 18px; font-weight: 600; color: #334155; line-height: 1.4; }

        .choice-group { display: flex; gap: 10px; flex-shrink: 0; justify-content: flex-end; }
        
        .choice-btn {
            background: #e2e8f0;
            border: 2px solid #cbd5e1;
            color: #475569;
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            width: 45px; height: 40px;
            border-radius: 10px;
            cursor: pointer; transition: 0.2s;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 0 #94a3b8;
        }
        .choice-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        
        /* Correct/Wrong States */
        .choice-btn.correct { background: #22c55e; border-color: #16a34a; color: white; box-shadow: 0 4px 0 #15803d; }
        .choice-btn.wrong { background: #ef4444; border-color: #dc2626; color: white; box-shadow: 0 4px 0 #b91c1c; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); }
            100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
        }

        .primary-btn { width: 100%; background: var(--main); color: white; font-weight: 800; font-size: 18px; padding: 15px; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 var(--dark); margin-top: 10px; transition: 0.1s; }
        .primary-btn:active { transform: translateY(4px); box-shadow: none; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 20px; text-align: center; width: 100%; max-width: 320px; border: 4px solid var(--main); }
        .modal-box input { width: 100%; padding: 10px; margin-bottom: 12px; border: 2px solid #fdba74; border-radius: 10px; text-align: center; font-family: 'Sarabun'; font-size: 16px; outline: none; }
    </style>
</head>
<body>
    
    <div class="container" id="gameContainer">
        <h1>6e Sounds great! Making suggestions / Responding</h1>
        
        <div id="userProfile" class="profile-bar hidden">
            <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
            <button class="btn-switch" onclick="switchAccount()">🔄 สลับ</button>
        </div>

        <div class="instruction">
            🎧 Listen and repeat. Which sentences can we use to:<br>
            <span style="color:var(--main);">make a suggestion? (S)</span> or <span style="color:var(--main);">respond to a suggestion? (R)</span>
        </div>

        <div id="questionList"></div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 style="color:var(--dark); font-size: 22px; margin-top:0;">📝 ลงชื่อเข้าเรียน</h2>
            <input type="text" id="in_name" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="primary-btn" onclick="confirmUser()">เริ่มทำแบบฝึกหัด</button>
        </div>
    </div>

    <!-- Score Modal -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark); font-size: 24px; margin-top:0;">🎉 เสร็จสิ้น!</h2>
            <div style="font-size: 50px; font-weight: 900; color: var(--main); margin: 10px 0;"><span id="finalScore">0</span> / 7</div>
            <div id="saveStatus" style="font-weight:bold; color:#15803d; margin-bottom: 15px;"></div>
            <button class="primary-btn" onclick="location.reload()">🔄 เริ่มใหม่</button>
        </div>
    </div>

    <script>
        const TOPIC_NAME = "ม.1 Unit 6 Sounds great Suggest or Respond";
        
        const sentences = [
            { id: 1, text: "Sure, that's a good idea.", answer: "R", audio: "audio1.mp3" },
            { id: 2, text: "How about going tomorrow?", answer: "S", audio: "audio2.mp3" },
            { id: 3, text: "Why don't we go jogging in the park?", answer: "S", audio: "audio3.mp3" },
            { id: 4, text: "Sounds great!", answer: "R", audio: "audio4.mp3" },
            { id: 5, text: "Let's go shopping!", answer: "S", audio: "audio5.mp3" },
            { id: 6, text: "Sorry, I'm busy this afternoon.", answer: "R", audio: "audio6.mp3" },
            { id: 7, text: "How about going for a burger?", answer: "S", audio: "audio7.mp3" }
        ];

        let score = 0;
        let answeredCount = 0;
        let currentAudio = null;

        window.onload = () => { 
            if(!localStorage.getItem('studentId')) document.getElementById('loginModal').classList.add('active');
            else { checkLogin(); renderQuestions(); }
        };

        document.getElementById('in_room').addEventListener('blur', function() {
            let val = this.value.trim().replace(/ม\.?/g, '').trim(); 
            let nums = val.match(/\d+/g);
            if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
            else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
        });

        function checkLogin() {
            document.getElementById('userProfile').classList.remove('hidden');
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        }

        function switchAccount() {
            localStorage.clear();
            document.getElementById('userProfile').classList.add('hidden');
            document.getElementById('loginModal').classList.add('active');
        }

        function confirmUser() {
            let n = document.getElementById('in_name').value.trim();
            let r = document.getElementById('in_room').value.trim();
            let id = document.getElementById('in_id').value.trim();
            if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกให้ครบ และรหัส 5 หลัก', 'warning'); return; }
            localStorage.setItem('studentName', n); localStorage.setItem('studentRoom', r); localStorage.setItem('studentId', id);
            document.getElementById('loginModal').classList.remove('active');
            checkLogin(); renderQuestions();
        }

        function renderQuestions() {
            const list = document.getElementById('questionList');
            list.innerHTML = '';
            score = 0;
            answeredCount = 0;

            sentences.forEach((item, index) => {
                let row = document.createElement('div');
                row.className = 'question-row';
                row.id = `row-${item.id}`;
                
                row.innerHTML = `
                    <div class="sentence-group">
                        <div class="play-btn" id="btn-audio-${item.id}" onclick="playAudio('${item.audio}', ${item.id})">🎧</div>
                        <div class="sentence-text"><span style="color:#94a3b8; font-weight:800;">${index + 1}.</span> ${item.text}</div>
                    </div>
                    <div class="choice-group">
                        <button class="choice-btn" id="btn-S-${item.id}" onclick="checkAnswer(${item.id}, 'S')">S</button>
                        <button class="choice-btn" id="btn-R-${item.id}" onclick="checkAnswer(${item.id}, 'R')">R</button>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        function playAudio(audioSrc, id) {
            if(currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                document.querySelectorAll('.play-btn').forEach(btn => btn.classList.remove('playing'));
            }
            
            const btn = document.getElementById(`btn-audio-${id}`);
            currentAudio = new Audio(audioSrc);
            
            currentAudio.onplaying = () => btn.classList.add('playing');
            currentAudio.onended = () => btn.classList.remove('playing');
            currentAudio.onerror = () => { btn.classList.remove('playing'); console.log("Audio not found"); };
            
            currentAudio.play();
        }

        function checkAnswer(id, choice) {
            const row = document.getElementById(`row-${id}`);
            if (row.classList.contains('disabled')) return; // ป้องกันการกดซ้ำ

            const item = sentences.find(s => s.id === id);
            const isCorrect = (item.answer === choice);
            const clickedBtn = document.getElementById(`btn-${choice}-${id}`);

            row.classList.add('disabled'); // ล็อกข้อนี้
            answeredCount++;

            if (isCorrect) {
                score++;
                clickedBtn.classList.add('correct');
                playCorrectSound();
            } else {
                clickedBtn.classList.add('wrong');
                playWrongSound();
                // ไฮไลท์ข้อที่ถูกให้ดูด้วย (Optional)
                document.getElementById(`btn-${item.answer}-${id}`).classList.add('correct');
            }

            if (answeredCount === sentences.length) {
                setTimeout(finishGame, 1000);
            }
        }

        function finishGame() {
            document.getElementById('scoreModal').classList.add('active');
            document.getElementById('finalScore').innerText = score;
            const stat = document.getElementById('saveStatus');
            if(typeof QUIZ_CONFIG === 'undefined') { stat.innerText = "❌ ไม่พบการเชื่อมต่อ Sheet"; return; }
            stat.innerText = "⏳ กำลังส่งคะแนน...";
            
            fetch(QUIZ_CONFIG.SCRIPT_URL, { 
                method: 'POST', mode: 'no-cors', 
                body: JSON.stringify({ 
                    name: localStorage.getItem('studentName'), 
                    room: localStorage.getItem('studentRoom'), 
                    id: "'"+localStorage.getItem('studentId'), 
                    lesson: TOPIC_NAME, 
                    score: score, 
                    maxScore: sentences.length 
                }) 
            }).catch(e=>{});
            
            setTimeout(() => { stat.innerText = "✅ บันทึกคะแนนเรียบร้อย!"; }, 1500);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, duration, type="sine") {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = freq; osc.type = type;
            osc.start();
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }
        function playCorrectSound() { playBeep(523.25, 0.1); setTimeout(() => playBeep(659.25, 0.2), 100); }
        function playWrongSound() { playBeep(250, 0.3, "sawtooth"); }
    </script>
</body>
</html>
