<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sounds Great! Vocab & Phrases</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --main: #f97316; --dark: #c2410c; --success: #22c55e; --success-dark: #15803d; }
        body { 
            font-family: 'Sarabun', sans-serif; 
            margin: 0; padding: 15px; 
            background: #fff7ed;
            min-height: 100vh;
        }
        
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        h1 { font-family: 'Fredoka One', cursive; color: var(--main); text-align: center; font-size: 24px; margin: 5px 0 15px 0; }
        
        .progress-indicator { text-align: center; font-size: 16px; font-weight: bold; color: #64748b; margin-bottom: 20px; }

        /* Flipcard Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            justify-content: center;
        }
        @media (max-width: 400px) {
            .card-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .flip-card {
            background-color: transparent;
            width: 100%;
            min-height: 160px; /* ปรับให้สูงพอสำหรับประโยคยาวๆ */
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid #fed7aa;
            padding: 15px;
            transition: all 0.3s ease;
        }

        /* ด้านหน้าการ์ด */
        .flip-card-front {
            background-color: white;
        }
        
        .speaker-btn {
            background: #fef08a;
            border: 2px solid #ca8a04;
            color: #854d0e;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 10;
        }
        .speaker-btn:active { transform: scale(0.9); background: #fde047; }

        .vocab-eng {
            font-family: 'Sarabun', sans-serif;
            font-weight: 800;
            font-size: 16px;
            color: #1e293b;
            line-height: 1.3;
            word-break: keep-all;
            margin-top: 15px;
        }

        /* ด้านหลังการ์ด */
        .flip-card-back {
            background: linear-gradient(135deg, #f97316, #fb923c);
            color: white;
            transform: rotateY(180deg);
            border-color: #c2410c;
        }

        .vocab-thai {
            font-size: 16px;
            font-weight: 800;
            line-height: 1.4;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* ไฮไลท์สีเขียวเมื่อเปิดแล้ว */
        .flip-card.completed .flip-card-front {
            border-color: var(--success);
            background-color: #f0fdf4;
        }
        .flip-card.completed .flip-card-back {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            border-color: var(--success-dark);
        }

        .primary-btn { width: 100%; max-width: 300px; margin: 25px auto 0 auto; background: var(--main); color: white; font-weight: 800; font-size: 18px; padding: 15px; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 var(--dark); transition: 0.1s; display: none; justify-content: center; align-items: center; gap: 8px; }
        .primary-btn:active { transform: translateY(4px); box-shadow: none; }

    </style>
</head>
<body>
    
    <div class="container" id="gameContainer">
        <h1>💬 Sounds Great! Vocab & Phrases</h1>
        
        <div class="progress-indicator" id="progressIndicator">เรียนรู้แล้ว: 0 / 10</div>

        <div class="card-grid" id="cardGrid"></div>

        <button class="primary-btn" id="finishBtn" onclick="location.reload()">🔄 เริ่มทบทวนใหม่</button>
    </div>

    <script>
        // ข้อมูลการ์ดทั้ง 10 ใบ
        const vocabList = [
            { id: "v1", word: "Sure, that's a good idea.", translation: "ได้เลย<br>เป็นความคิดที่ดีนะ", audio: "audio1.mp3" },
            { id: "v2", word: "How about going tomorrow?", translation: "ไปพรุ่งนี้ดีไหม?", audio: "audio2.mp3" },
            { id: "v3", word: "Why don't we go jogging in the park?", translation: "ไปวิ่งจ็อกกิ้งที่<br>สวนสาธารณะกันไหม?", audio: "audio3.mp3" },
            { id: "v4", word: "Sounds great!", translation: "ฟังดูเยี่ยมไปเลย!", audio: "audio4.mp3" },
            { id: "v5", word: "Let's go shopping!", translation: "ไปช้อปปิ้งกันเถอะ!", audio: "audio5.mp3" },
            { id: "v6", word: "Sorry, I'm busy this afternoon.", translation: "ขอโทษนะ<br>บ่ายนี้ฉันยุ่ง", audio: "audio6.mp3" },
            { id: "v7", word: "How about going for a burger?", translation: "ไปกินเบอร์เกอร์กันไหม?", audio: "audio7.mp3" },
            { id: "v8", word: "Are you free this afternoon? (phr.)", translation: "บ่ายนี้คุณว่างไหม?", audio: "audio8.mp3" },
            { id: "v9", word: "tired (adj.)", translation: "เหนื่อย", audio: "audio9.mp3" },
            { id: "v10", word: "suggest (v.)", translation: "แนะนำ, เสนอแนะ", audio: "audio10.mp3" }
        ];

        let flippedCards = new Set();
        let currentAudio = null;

        window.onload = () => { 
            startGame(); 
        };

        function startGame() {
            // สุ่มตำแหน่งการ์ด
            vocabList.sort(() => Math.random() - 0.5); 
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';

            vocabList.forEach(item => {
                let card = document.createElement('div');
                card.className = "flip-card";
                card.id = `card-${item.id}`;
                card.innerHTML = `
                    <div class="flip-card-inner" id="inner-${item.id}">
                        <div class="flip-card-front" onclick="handleFlip('${item.id}')">
                            <div class="speaker-btn" onclick="playAudio(event, '${item.audio}')">🔊</div>
                            <div class="vocab-eng">${item.word}</div>
                        </div>
                        <div class="flip-card-back" onclick="handleFlip('${item.id}')">
                            <div class="vocab-thai">${item.translation}</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function handleFlip(id) {
            const cardElement = document.getElementById(`card-${id}`);
            const cardInner = document.getElementById(`inner-${id}`);
            
            cardInner.parentElement.classList.toggle('flipped');

            // เพิ่มคลาส completed (ไฮไลท์สีเขียว) เมื่อเปิดครั้งแรก
            if (!cardElement.classList.contains('completed')) {
                cardElement.classList.add('completed');
                flippedCards.add(id);
                updateProgress();
            }
        }

        function playAudio(event, audioSrc) {
            // ป้องกันไม่ให้คลิกปุ่มลำโพงแล้วการ์ดพลิก
            event.stopPropagation();
            
            if(currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            currentAudio = new Audio(audioSrc);
            currentAudio.play().catch(e => console.log("กำลังรอไฟล์เสียงอัปโหลด..."));
        }

        function updateProgress() {
            document.getElementById('progressIndicator').innerText = `เรียนรู้แล้ว: ${flippedCards.size} / ${vocabList.length}`;
            if (flippedCards.size === vocabList.length) {
                document.getElementById('finishBtn').style.display = 'flex';
                
                // แจ้งเตือนเมื่อเปิดครบ
                if(!window.finishedAlertShown) {
                    Swal.fire({
                        title: 'ยอดเยี่ยมมาก!',
                        text: 'คุณทบทวนคำศัพท์และประโยคครบทุกข้อแล้ว 🎉',
                        icon: 'success',
                        confirmButtonColor: '#22c55e',
                        confirmButtonText: 'ตกลง'
                    });
                    window.finishedAlertShown = true;
                }
            }
        }
    </script>
</body>
</html>
