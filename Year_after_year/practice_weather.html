<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Quiz: Weather</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    <style>
        :root {
            --main-theme: #86efac; --dark-theme: #16a34a; --accent-theme: #14532d;
            --shadow-3d: rgba(22, 163, 74, 0.15);
        }
        body { font-family: 'Sarabun', sans-serif; background: #f0f9ff; margin: 0; padding: 15px; text-align: center; color: #334155; }
        h1 { font-family: 'Fredoka One', cursive; color: #0284c7; margin-bottom: 5px; font-size: 28px;}
        h2 { font-size: 16px; color: #64748b; margin-top: 0; margin-bottom: 20px;}
        
        .profile-bar {
            font-size: clamp(12px, 3.5vw, 14px); background: #dcfce7; border: 2px solid #86efac;
            padding: 8px 15px; border-radius: 20px; color: var(--dark-theme); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin: 0 auto 20px auto; max-width: 400px;
        }
        .btn-switch { background: #fca5a5; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        #start-screen { background: white; padding: 30px 20px; border-radius: 20px; max-width: 400px; margin: 20px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .btn-start { background: #22c55e; color: white; border: none; padding: 15px 20px; font-size: 20px; border-radius: 15px; cursor: pointer; font-weight: 800; width: 100%; box-shadow: 0 4px 0 #16a34a; font-family: 'Sarabun'; transition: 0.1s;}
        .btn-start:active { transform: translateY(4px); box-shadow: none; }

        #game-board { display: none; max-width: 600px; margin: 0 auto; }
        .stats { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; margin-bottom: 15px; background: white; padding: 10px 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        
        .question-img-container {
            width: 100%;
            background: white;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .question-img { 
            width: 100%; 
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            border-radius: 10px; 
            background-color: #f8fafc;
        }
        
        .options-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            width: 100%;
        }
        
        .option-btn {
            background: white;
            color: #334155;
            border: 3px solid #cbd5e1;
            padding: 15px 10px;
            font-size: 18px;
            font-family: 'Fredoka One', cursive;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 0 #cbd5e1;
        }
        .option-btn:active { transform: translateY(4px); box-shadow: none; }
        
        /* ไฮไลท์ตอนตอบถูก/ผิด */
        .option-btn.correct { background: #22c55e; color: white; border-color: #16a34a; box-shadow: 0 4px 0 #16a34a; }
        .option-btn.wrong { background: #ef4444; color: white; border-color: #dc2626; box-shadow: 0 4px 0 #dc2626; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240,253,244,0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: opacity 0.3s; padding: 15px; box-sizing: border-box; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 30px; text-align: center; width: 100%; max-width: 340px; border: 4px solid var(--main-theme); box-shadow: 8px 12px 25px var(--shadow-3d); box-sizing: border-box; }
        .modal-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid var(--main-theme); border-radius: 15px; text-align: center; font-family: 'Sarabun'; font-size: 16px; font-weight: 600; box-sizing: border-box; outline: none; }
        .modal-box input:focus { border-color: var(--dark-theme); }
        .btn-action { width: 100%; padding: 14px; background: var(--main-theme); color: var(--accent-theme); border: none; border-radius: 15px; font-weight: 800; cursor: pointer; font-family: 'Sarabun'; box-shadow: 0 4px 0 var(--dark-theme); transition: 0.1s; font-size: 17px; }
        .btn-action:active { transform: translateY(3px); box-shadow: none; }
        .score-num { font-size: 55px; font-weight: 900; color: var(--dark-theme); margin: 10px 0; display: block; }

        @media (max-width: 480px) {
            .options-grid { grid-template-columns: 1fr; } /* มือถือแสดงตัวเลือกแถวละ 1 */
        }
    </style>
</head>
<body>

    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับ</button>
    </div>

    <div id="start-screen">
        <h1>Vocabulary Quiz</h1>
        <h2>Weather</h2>
        <p style="font-size: 16px;"><strong>วิธีเล่น:</strong> ดูภาพ แล้วเลือกคำศัพท์ให้ถูกต้อง!</p>
        <button class="btn-start" onclick="startGame()">▶️ เริ่มทำแบบฝึกหัด</button>
    </div>

    <div id="game-board">
        <div class="stats">
            <div>📝 <span id="qCount" style="color: #64748b;">ข้อ 1 / 6</span></div>
            <div>⏱️ <span id="time" style="color: #ef4444;">60</span>s</div>
            <div>⭐ <span id="score" style="color: #eab308;">0</span></div>
        </div>
        
        <div class="question-img-container">
            <img id="current-img" src="" class="question-img" alt="Question Image">
        </div>

        <div class="options-grid" id="options-container">
            <!-- ปุ่มตัวเลือกจะถูกสร้างอัตโนมัติ -->
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 id="modalTitle" style="color:var(--dark-theme); margin-top:0; font-size: 24px;">📝 ลงชื่อเข้าเรียน</h2>
            <p id="modalSub" style="color: #6b7280; font-weight: 600; margin-top: 0; display:none; font-size: 14px;"></p>
            <input type="text" id="in_name" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-action" onclick="confirmUser()">🚀 ยืนยันข้อมูล</button>
        </div>
    </div>

    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-theme); margin-top:0; font-size: 26px;">🎉 ส่งคำตอบแล้ว!</h2>
            <p style="color: #6b7280; font-weight: 600;">คะแนนของคุณคือ</p>
            <span class="score-num"><span id="finalScoreText">0</span> / 6</span>
            <div id="saveStatus" style="font-weight:bold; font-size:15px; margin-bottom:15px; color:#15803d;"></div>
            <button id="playAgainBtn" class="btn-action" onclick="restartGame()" style="display:none;">🔄 กลับหน้าแรก</button>
        </div>
    </div>

<script>
    const vocabData = [
        { id: 'wet_rainy', text: 'wet & rainy' },
        { id: 'cloudy_windy', text: 'cloudy & windy' },
        { id: 'cold_snowy', text: 'cold & snowy' },
        { id: 'hot_sunny', text: 'hot & sunny' },
        { id: 'warm_sunny', text: 'warm & sunny' },
        { id: 'chilly_foggy', text: 'chilly & foggy' }
    ];
    
    const TOPIC_NAME = 'ม.1 Unit 6 Year after year Vocab weather';
    const MAX_Q = vocabData.length; 

    let score = 0;
    let timeLeft = 60;
    let timer;
    let currentQ = 1;
    let currentItem = null;
    let isSwitchingAccount = false;
    let canClick = true;
    let questionList = []; 

    // --- Web Audio API สำหรับสร้างเสียงเอฟเฟกต์ (ไม่ต้องใช้ไฟล์) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    
    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSoundEffect(isCorrect) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (isCorrect) {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }
    // --------------------------------------------------------

    window.onload = () => { checkLoginStatus(); };

    function checkLoginStatus() {
        if(localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        } else {
            document.getElementById('userProfile').style.display = 'none';
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ เปลี่ยนคนเล่น?', text: "ข้อมูลเดิมจะถูกสลับออกนะ", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#16a34a', cancelButtonColor: '#9ca3af',
            confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก'
        }).then((res) => {
            if(res.isConfirmed) {
                localStorage.clear(); isSwitchingAccount = true;
                document.getElementById('in_name').value = ''; 
                document.getElementById('in_room').value = ''; 
                document.getElementById('in_id').value = '';
                document.getElementById('modalTitle').innerText = "🔄 ลงชื่อบัญชีใหม่";
                document.getElementById('modalSub').innerText = "กรอกข้อมูลเพื่อเล่นต่อ";
                document.getElementById('modalSub').style.display = 'block';
                checkLoginStatus(); 
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        let nums = this.value.match(/\d+/g);
        if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
        else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
    });

    function confirmUser() {
        let n = document.getElementById('in_name').value.trim();
        let r = document.getElementById('in_room').value.trim();
        let id = document.getElementById('in_id').value.trim();
        if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัส 5 หลัก', 'warning'); return; }
        
        localStorage.setItem('studentName', n); 
        localStorage.setItem('studentRoom', r); 
        localStorage.setItem('studentId', id);
        
        document.getElementById('loginModal').classList.remove('active'); 
        checkLoginStatus();

        if (isSwitchingAccount) { 
            isSwitchingAccount = false; 
        } else { 
            submitScore(); 
        }
    }

    function submitScore() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = score;
        const stat = document.getElementById('saveStatus');
        const playAgainBtn = document.getElementById('playAgainBtn');
        checkLoginStatus();

        if(typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ ไม่พบไฟล์ตั้งค่าการเชื่อมต่อ (quiz-config.js)"; 
            playAgainBtn.style.display = 'block'; return;
        }

        stat.innerText = "⏳ กำลังส่งคะแนน...";
        stat.style.color = "var(--dark-theme)";
        playAgainBtn.style.display = 'none';

        const payload = {
            name: localStorage.getItem('studentName'), 
            room: localStorage.getItem('studentRoom'),
            studentId: "'" + localStorage.getItem('studentId'), 
            lesson: TOPIC_NAME, 
            score: score, 
            maxScore: MAX_Q
        };

        fetch(QUIZ_CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = "✅ บันทึกคะแนนลงระบบเรียบร้อย!"; 
            stat.style.color = "#15803d";
            playAgainBtn.style.display = 'block';
        }, 2000);
    }

    function startGame() {
        initAudio(); // ปลุกระบบเสียง
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-board').style.display = 'block';
        score = 0; currentQ = 1; timeLeft = 60;
        document.getElementById('score').innerText = score;
        
        // สุ่มลำดับคำถาม
        questionList = [...vocabData].sort(() => Math.random() - 0.5);
        nextQuestion();
        
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('time').innerText = timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function nextQuestion() {
        if(currentQ > MAX_Q || questionList.length === 0) {
            endGame(); return;
        }
        
        document.getElementById('qCount').innerText = `ข้อ ${currentQ} / ${MAX_Q}`;
        currentItem = questionList.pop();
        
        // โชว์รูปภาพ
        document.getElementById('current-img').src = currentItem.id + '.jpg';
        
        // สร้างตัวเลือก 4 ตัว (ถูก 1, สุ่มผิด 3)
        let options = [currentItem];
        let others = vocabData.filter(v => v.id !== currentItem.id).sort(() => Math.random() - 0.5);
        options = options.concat(others.slice(0, 3)).sort(() => Math.random() - 0.5); // รวมกันแล้วสลับตำแหน่ง
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        options.forEach(opt => {
            optionsContainer.innerHTML += `<button class="option-btn" id="btn-${opt.id}" onclick="checkAnswer('${opt.id}')">${opt.text}</button>`;
        });

        canClick = true;
    }

    function checkAnswer(selectedId) {
        if (!canClick) return;
        canClick = false;

        const selectedBtn = document.getElementById(`btn-${selectedId}`);
        const correctBtn = document.getElementById(`btn-${currentItem.id}`);

        if (selectedId === currentItem.id) {
            score++;
            document.getElementById('score').innerText = score;
            selectedBtn.classList.add('correct');
            playSoundEffect(true);
        } else {
            selectedBtn.classList.add('wrong');
            correctBtn.classList.add('correct'); // เฉลยข้อที่ถูก
            playSoundEffect(false);
        }

        setTimeout(() => {
            currentQ++;
            nextQuestion();
        }, 1200);
    }

    function endGame() {
        clearInterval(timer);
        document.getElementById('game-board').style.display = 'none';
        
        if(!localStorage.getItem('studentId')) {
            document.getElementById('modalTitle').innerText = "👋 ทำแบบฝึกหัดเสร็จแล้ว!";
            document.getElementById('modalSub').innerText = `ได้คะแนน ${score}/${MAX_Q} กรอกข้อมูลเพื่อบันทึก`;
            document.getElementById('modalSub').style.display = 'block';
            document.getElementById('loginModal').classList.add('active');
        } else { 
            submitScore(); 
        }
    }

    function restartGame() {
        document.getElementById('scoreModal').classList.remove('active');
        document.getElementById('start-screen').style.display = 'block';
    }
</script>
</body>
</html>
