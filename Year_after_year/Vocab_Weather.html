<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocabulary Flashcards - Weather</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    
    <style>
        :root {
            --main-theme: #0ea5e9; 
            --dark-theme: #0284c7;
        }

        body { 
            font-family: 'Sarabun', sans-serif; 
            background: #f0f9ff; 
            margin: 0; 
            padding: 15px 10px; 
            text-align: center; 
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }
        h1 { font-family: 'Fredoka One', cursive; color: var(--dark-theme); margin-top: 10px; margin-bottom: 5px;}
        p { color: #64748b; margin-bottom: 20px; font-size: 15px; font-weight: 600; }

        /* Profile Bar */
        .profile-bar {
            font-size: clamp(12px, 3.5vw, 14px); background: #e0f2fe; border: 2px solid var(--main-theme);
            padding: 8px 15px; border-radius: 20px; color: var(--dark-theme); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; width: 100%; max-width: 960px; box-sizing: border-box;
        }
        .btn-switch { background: #f43f5e; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        /* Grid & Cards */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr);
            gap: 20px; 
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            padding: 10px;
            box-sizing: border-box;
        }

        .flip-card { 
            background-color: transparent; 
            width: 100%; 
            height: auto;
            aspect-ratio: 4 / 3.2;
            perspective: 1000px; 
            cursor: pointer; 
            position: relative;
        }

        .flip-card-inner { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            text-align: center; 
            transition: transform 0.6s, box-shadow 0.3s; 
            transform-style: preserve-3d; 
            border-radius: 20px;
        }

        .flip-card.flipped .flip-card-inner { 
            transform: rotateY(180deg); 
        }

        /* ไฮไลท์เมื่อฝึกสำเร็จ */
        .flip-card.completed-highlight .flip-card-inner {
            box-shadow: 0 0 0 4px #22c55e, 0 8px 16px rgba(34, 197, 94, 0.4);
        }

        .status-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: white;
            border-radius: 50%;
            font-size: 20px;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none;
        }
        .flip-card.completed-highlight .status-badge { display: block; animation: pop 0.3s ease-out; }

        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .flip-card-front, .flip-card-back { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 20px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 10px; 
            box-sizing: border-box; 
        }

        .flip-card-front { background-color: white; }
        
        .flip-card-back { 
            background-color: #dcfce7; 
            color: #16a34a; 
            transform: rotateY(180deg); 
            font-size: clamp(18px, 4vw, 24px); 
            font-weight: 800; 
            border: 4px solid #86efac;
        }

        .card-img { 
            width: 100%; 
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            border-radius: 12px;
            background-color: #f8fafc;
        }

        .vocab-container {
            display: flex; align-items: center; justify-content: center; 
            position: relative; width: 100%; margin-top: 10px; padding: 0 5px;
        }

        .vocab-text { 
            font-family: 'Fredoka One', cursive; font-size: clamp(14px, 3vw, 18px); 
            color: #334155; margin: 0; white-space: nowrap; 
        }

        .play-btn { 
            position: absolute; right: 5px; background: #3b82f6; color: white; border: none; 
            border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; 
            justify-content: center; align-items: center; font-size: 18px; box-shadow: 0 3px 0 #2563eb; transition: 0.1s;
        }
        .play-btn:active { transform: translateY(3px); box-shadow: none; }
        .play-btn.played-glow { background: #10b981; box-shadow: 0 3px 0 #059669; }

        /* Buttons Layout */
        .btn-group {
            display: flex; width: 100%; max-width: 400px; justify-content: center;
            margin-top: 30px; margin-bottom: 30px; padding: 0 10px; box-sizing: border-box;
        }
        .btn-action { 
            width: 100%; padding: 15px; color: white; border: none; 
            border-radius: 15px; font-weight: 800; cursor: pointer; font-family: 'Sarabun'; 
            transition: 0.1s; font-size: 20px; background: var(--main-theme); box-shadow: 0 6px 0 var(--dark-theme);
        }
        .btn-action:active { transform: translateY(6px); box-shadow: none; }

        /* Modal UI */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240,249,255,0.9); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; box-sizing: border-box; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 30px; text-align: center; width: 100%; max-width: 340px; border: 4px solid var(--main-theme); box-shadow: 0 15px 30px rgba(14, 165, 233, 0.2); box-sizing: border-box; }
        .modal-box input.login-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid var(--main-theme); border-radius: 15px; text-align: center; font-family: 'Sarabun'; font-size: 16px; font-weight: 600; box-sizing: border-box; outline: none; }
        .modal-box input.login-input:focus { border-color: var(--dark-theme); }
        .score-num { font-size: 60px; font-weight: 900; color: var(--dark-theme); margin: 10px 0; display: block; line-height: 1;}

        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            .flip-card { aspect-ratio: 4 / 3.5; }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
            .flip-card { aspect-ratio: 4 / 3.2; }
        }
    </style>
</head>
<body>

    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับบัญชี</button>
    </div>

    <h1>Weather Vocabulary</h1>
    <p>แตะไอคอน 🔊 เพื่อฟังเสียง และแตะการ์ดเพื่อดูคำแปลให้ครบทุกใบ (ได้ 1 คะแนนต่อใบ)</p>

    <div class="grid" id="flashcard-grid">
        <!-- การ์ดจะถูกสร้างด้วย JavaScript -->
    </div>

    <div class="btn-group">
        <!-- เหลือแค่ปุ่มส่งคะแนนปุ่มเดียว -->
        <button class="btn-action" onclick="trySubmit()">✅ ส่งคะแนน</button>
    </div>

    <!-- Modal Login -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 id="modalTitle" style="color:var(--dark-theme); margin-top:0; font-size: 24px;">📝 ลงชื่อใช้งาน</h2>
            <p id="modalSub" style="color: #64748b; font-weight: 600; margin-top: 0; font-size: 14px;"></p>
            <input type="text" id="in_name" class="login-input" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" class="login-input" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" class="login-input" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-action" id="btnSubmitLogin" onclick="confirmUser()" style="margin-top:5px; margin-bottom: 0;">🚀 ยืนยัน</button>
        </div>
    </div>

    <!-- Modal Score/Success -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-theme); margin-top:0; font-size: 26px;">🎉 ส่งสำเร็จ!</h2>
            <p style="color: #64748b; font-weight: 600; margin-bottom: 0;">คะแนนทบทวนคำศัพท์ของคุณ</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:30px; color:#bae6fd;">/6</span></span>
            <div id="saveStatus" style="font-weight:bold; font-size:15px; margin-bottom:15px; color:#15803d; min-height:22px;"></div>
            <!-- ปุ่มปิดหน้าต่าง พร้อมรีสตาร์ทกระดานให้คนต่อไป -->
            <button class="btn-action" onclick="closeScoreModal()" style="margin-top:5px; margin-bottom: 0;">✅ ปิดและเริ่มใหม่</button>
        </div>
    </div>

<script>
    const TOPIC_NAME = 'ม.1 Unit 6 Weather Vocabulary Flashcards';
    const MAX_SCORE = 6;
    let score = 0;
    let isSubmitting = false; // ตัวแปรเช็คว่ากำลังล็อกอินเพื่อเริ่มเกม หรือล็อกอินเพื่อส่งคะแนน
    let currentAudio = null;

    const flashcards = [
        { id: 'wet_rainy', en: 'wet & rainy', th: 'ชื้นแฉะและมีฝนตก' },
        { id: 'cloudy_windy', en: 'cloudy & windy', th: 'มีเมฆมากและลมแรง' },
        { id: 'cold_snowy', en: 'cold & snowy', th: 'หนาวและมีหิมะตก' },
        { id: 'hot_sunny', en: 'hot & sunny', th: 'ร้อนและมีแดดจัด' },
        { id: 'warm_sunny', en: 'warm & sunny', th: 'อบอุ่นและมีแดด' },
        { id: 'chilly_foggy', en: 'chilly & foggy', th: 'หนาวเย็นและมีหมอก' }
    ];

    // เก็บสถานะการทำกิจกรรมของการ์ดแต่ละใบ
    let cardStates = {};

    function initGame() {
        const grid = document.getElementById('flashcard-grid');
        grid.innerHTML = '';
        cardStates = {};
        score = 0;
        if(currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }

        flashcards.forEach(card => {
            cardStates[card.id] = { flipped: false, played: false, completed: false };
            
            grid.innerHTML += `
                <div class="flip-card" id="card-${card.id}" onclick="toggleFlip('${card.id}')">
                    <div class="status-badge" id="badge-${card.id}">✅</div>
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="${card.id}.jpg" class="card-img" alt="${card.en}" onerror="this.src='https://placehold.co/400x225/bae6fd/0284c7?text=No+Image'">
                            <div class="vocab-container">
                                <h3 class="vocab-text">${card.en}</h3>
                                <button class="play-btn" id="audio-btn-${card.id}" onclick="playAudio(event, '${card.id}')">🔊</button>
                            </div>
                        </div>
                        <div class="flip-card-back">
                            ${card.th}
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // ทำงานเมื่อกดพลิกการ์ด
    function toggleFlip(id) {
        const cardElement = document.getElementById(`card-${id}`);
        cardElement.classList.toggle('flipped');
        
        if (!cardStates[id].flipped) {
            cardStates[id].flipped = true;
            checkCardComplete(id);
        }
    }

    // ทำงานเมื่อกดฟังเสียง
    function playAudio(event, id) {
        event.stopPropagation();
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }
        currentAudio = new Audio(`${id}.mp3`);
        currentAudio.play().catch(e => console.log('Audio error:', e));

        if (!cardStates[id].played) {
            cardStates[id].played = true;
            document.getElementById(`audio-btn-${id}`).classList.add('played-glow');
            checkCardComplete(id);
        }
    }

    // เช็คว่าการ์ดใบนั้น ฟังเสียง + พลิกดูคำแปล ครบหรือยัง
    function checkCardComplete(id) {
        if (cardStates[id].flipped && cardStates[id].played && !cardStates[id].completed) {
            cardStates[id].completed = true;
            document.getElementById(`card-${id}`).classList.add('completed-highlight');
            playSoundMiniSuccess();
        }
    }

    // คำนวณคะแนนปัจจุบัน
    function calculateScore() {
        return Object.values(cardStates).filter(state => state.completed).length;
    }

    function trySubmit() {
        score = calculateScore();
        if (score < MAX_SCORE) {
            Swal.fire({
                title: 'ยังฝึกไม่ครบทุกคำ!',
                html: `หนูทำสำเร็จไป <b>${score}</b> คำ จากทั้งหมด <b>${MAX_SCORE}</b> คำ<br>(ต้องกดฟังเสียงและดูคำแปลให้ครบ)<br><br><i>ต้องการส่งคะแนนเท่านี้ หรือกลับไปฝึกต่อ?</i>`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#f43f5e',
                cancelButtonColor: '#0ea5e9',
                confirmButtonText: 'ยืนยันส่งคะแนน',
                cancelButtonText: 'กลับไปฝึกให้ครบ'
            }).then((result) => {
                if (result.isConfirmed) proceedToLogin();
            });
        } else {
            proceedToLogin();
        }
    }

    function proceedToLogin() {
        if(!localStorage.getItem('studentId')) {
            isSubmitting = true; // ตั้งค่าว่ากำลังลงชื่อเพื่อ "ส่งคะแนน"
            document.getElementById('modalSub').innerText = `คะแนนที่ทำได้คือ ${score}/${MAX_SCORE}\nลงชื่อเพื่อบันทึกคะแนน`;
            document.getElementById('btnSubmitLogin').innerText = "🚀 บันทึกคะแนน";
            document.getElementById('loginModal').classList.add('active');
        } else {
            submitScore();
        }
    }

    // ================= ระบบลงชื่อ & ส่งคะแนน =================

    document.addEventListener("DOMContentLoaded", () => {
        initGame();
        if(localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        }
    });

    function switchAccount() {
        Swal.fire({
            title: '⚠️ สลับบัญชี?', text: "เปลี่ยนคนเล่น คำตอบบนกระดานจะถูกล้าง", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#0ea5e9', cancelButtonColor: '#94a3b8',
            confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก'
        }).then((res) => {
            if(res.isConfirmed) {
                localStorage.clear(); 
                document.getElementById('userProfile').style.display = 'none';
                
                isSubmitting = false; // ตั้งค่าว่ากำลังลงชื่อเพื่อ "เริ่มเรียนใหม่" (ไม่ส่งคะแนน)
                
                document.getElementById('in_name').value = '';
                document.getElementById('in_room').value = '';
                document.getElementById('in_id').value = '';
                
                document.getElementById('modalSub').innerText = "ลงชื่อเข้าใช้งานสำหรับนักเรียนคนใหม่ (กดตกลงเพื่อเริ่มฝึก)";
                document.getElementById('btnSubmitLogin').innerText = "🚀 เริ่มฝึกทบทวน";
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        let nums = this.value.match(/\d+/g);
        if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
        else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
    });

    function confirmUser() {
        let n = document.getElementById('in_name').value.trim();
        let r = document.getElementById('in_room').value.trim();
        let id = document.getElementById('in_id').value.trim();
        if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัส 5 หลัก', 'warning'); return; }
        
        localStorage.setItem('studentName', n); 
        localStorage.setItem('studentRoom', r); 
        localStorage.setItem('studentId', id);
        
        document.getElementById('loginModal').classList.remove('active');
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('p_name').innerText = n;
        document.getElementById('p_room').innerText = r;
        document.getElementById('p_id').innerText = id; 
        
        // แยกว่าเป็นการกดลงชื่อเพื่อส่งคะแนน หรือ แค่ลงชื่อเริ่มเล่นใหม่
        if (isSubmitting) {
            submitScore();
        } else {
            initGame(); // ล้างกระดานให้คนใหม่เล่น
        }
    }

    function submitScore() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = score;
        const stat = document.getElementById('saveStatus');
        
        if(typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ ไม่พบไฟล์ตั้งค่า (quiz-config.js)"; 
            return;
        }

        stat.innerText = "⏳ กำลังบันทึกคะแนน...";

        const payload = {
            name: localStorage.getItem('studentName'), 
            room: localStorage.getItem('studentRoom'),
            studentId: "'" + localStorage.getItem('studentId'), 
            lesson: TOPIC_NAME, score: score, maxScore: MAX_SCORE
        };

        fetch(QUIZ_CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = "✅ บันทึกคะแนนลงระบบเรียบร้อย!"; 
            playSoundSuccess();
        }, 1500);
    }

    function closeScoreModal() {
        // เมื่อกด ปิดและเริ่มใหม่
        document.getElementById('scoreModal').classList.remove('active');
        initGame();
    }

    function playSoundMiniSuccess() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    function playSoundSuccess() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } catch(e) {}
    }
</script>

</body>
</html>
