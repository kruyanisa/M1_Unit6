<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In all weathers - Vocabulary</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; color: #334155; }
        .header { text-align: center; color: #1e3a8a; font-size: 22px; font-weight: 800; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 800px; margin: 0 auto; }
        
        .season-card { 
            background-size: cover; background-position: center; border-radius: 20px; 
            padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            min-height: 250px; position: relative; border: 4px solid #fff;
        }

        /* ใส่รูปพื้นหลังตามไฟล์ของคุณครู */
        .card-winter { background-image: url('winter.png'); }
        .card-spring { background-image: url('spring.png'); }
        .card-autumn { background-image: url('autumn.png'); }
        .card-summer { background-image: url('summer.png'); }

        .season-title { 
            font-family: 'Fredoka One', sans-serif; font-size: 40px; margin: 0 0 10px 0; 
            display: flex; align-items: center; gap: 10px;
            /* เงาสีขาวหนาๆ เพื่อให้อ่านออกบนพื้นขาวหรือมืด */
            text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .month-list { list-style: none; padding: 0; margin: 0 0 0 20px; }
        .month-item { 
            font-size: 24px; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 2px 5px rgba(0,0,0,0.2);
        }

        /* สีอักษรอิงตามต้นฉบับหนังสือ */
        .text-winter { color: #0284c7; }
        .text-spring { color: #16a34a; }
        .text-autumn { color: #ea580c; }
        .text-summer { color: #0ea5e9; }

        /* ปุ่มหูฟัง */
        .btn-audio {
            background: #fff; border: 2px solid #cbd5e1; border-radius: 50%; width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center; font-size: 20px;
            cursor: pointer; box-shadow: 0 4px 0 #cbd5e1; transition: 0.1s;
        }
        .btn-audio:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-audio" onclick="playAudio('header')">🎧</button>
        Listen and repeat. What are these words in your language?
    </div>

    <div class="grid-container">
        <!-- Winter -->
        <div class="season-card card-winter">
            <h2 class="season-title text-winter">
                <button class="btn-audio" onclick="playAudio('Winter.wav')">🎧</button> Winter
            </h2>
            <ul class="month-list text-winter">
                <li class="month-item"><button class="btn-audio" onclick="playAudio('December.wav')">🎧</button> December</li>
                <li class="month-item"><button class="btn-audio" onclick="playAudio('January.wav')">🎧</button> January</li>
                <li class="month-item"><button class="btn-audio" onclick="playAudio('February.wav')">🎧</button> February</li>
            </ul>
        </div>

        <!-- Spring -->
        <div class="season-card card-spring">
            <h2 class="season-title text-spring">
                <button class="btn-audio" onclick="playAudio('Spring.wav')">🎧</button> Spring
            </h2>
            <ul class="month-list text-spring">
                <li class="month-item"><button class="btn-audio" onclick="playAudio('March.wav')">🎧</button> March</li>
                <li class="month-item"><button class="btn-audio" onclick="playAudio('April.wav')">🎧</button> April</li>
                <li class="month-item"><button class="btn-audio" onclick="playAudio('May.wav')">🎧</button> May</li>
            </ul>
        </div>

        <!-- Autumn -->
        <div class="season-card card-autumn">
            <h2 class="season-title text-autumn">
                <button class="btn-audio" onclick="playAudio('Autumn.wav')">🎧</button> Autumn
            </h2>
            <ul class="month-list text-autumn">
                <li class="month-item"><button class="btn-audio" onclick="playAudio('September.wav')">🎧</button> September</li>
                <li class="month-item"><button class="btn-audio" onclick="playAudio('October.wav')">🎧</button> October</li>
                <li class="month-item"><button class="btn-audio" onclick="playAudio('November.wav')">🎧</button> November</li>
            </ul>
        </div>

        <!-- Summer -->
        <div class="season-card card-summer">
            <h2 class="season-title text-summer">
                <button class="btn-audio" onclick="playAudio('Summer.wav')">🎧</button> Summer
            </h2>
            <ul class="month-list text-summer">
                <li class="month-item"><button class="btn-audio" onclick="playAudio('June.wav')">🎧</button> June</li>
                <li class="month-item"><button class="btn-audio" onclick="playAudio('July.wav')">🎧</button> July</li>
                <li class="month-item"><button class="btn-audio" onclick="playAudio('August.wav')">🎧</button> August</li>
            </ul>
        </div>
    </div>

<script>
    let currentAudio = null;

    function playAudio(fileName) {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }

        // กรณีหัวข้อหลัก ใช้ TTS เสียงอังกฤษ
        if (fileName === 'header') {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let msg = new SpeechSynthesisUtterance("Listen and repeat. What are these words in your language?");
                msg.lang = 'en-GB';
                window.speechSynthesis.speak(msg);
            }
            return;
        }

        // เล่นไฟล์ .wav ที่อยู่ในโฟลเดอร์เดียวกัน
        currentAudio = new Audio(fileName);
        currentAudio.play().catch(e => {
            console.error("ไม่สามารถเล่นเสียงได้ กรุณาตรวจสอบชื่อไฟล์ให้ตรงตัวพิมพ์เล็ก-ใหญ่:", e);
        });
    }
</script>
</body>
</html>
