<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Scramble - It's fun! Vocab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    
    <style>
        :root { --main: #8b5cf6; --dark: #6d28d9; --bg: #f5f3ff; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); color: #334155; margin: 0; padding: 15px; }
        h1 { font-family: 'Fredoka One', cursive; color: var(--main); text-align: center; font-size: 26px; margin-bottom: 5px; }
        
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; padding: 25px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .hidden { display: none !important; }
        
        .profile-bar { font-size: 14px; background: #ede9fe; border: 2px solid #ddd6fe; padding: 8px 15px; border-radius: 20px; color: var(--dark); font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; }
        .btn-switch { background: #fca5a5; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }
        
        .progress-text { text-align: center; color: #64748b; font-weight: bold; margin-bottom: 15px; }
        .hint-text { text-align: center; font-size: 24px; font-weight: 800; color: #1e293b; margin-bottom: 15px; }
        
        .audio-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 250px; margin: 0 auto 25px auto; background: #fbbf24; color: #b45309; font-weight: bold; padding: 12px; border-radius: 20px; cursor: pointer; border: none; font-family: 'Sarabun'; font-size: 16px; box-shadow: 0 4px 0 #d97706; transition: 0.1s; }
        .audio-btn:active { transform: translateY(4px); box-shadow: none; }
        
        .slots-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; min-height: 45px; }
        .slot { width: 40px; height: 45px; border: 2px dashed #cbd5e1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; font-family: 'Fredoka One', sans-serif; color: var(--main); background: #f8fafc; cursor: pointer; transition: 0.2s; text-transform: lowercase; }
        .slot.filled { border: 2px solid var(--main); background: white; box-shadow: 0 2px 0 var(--main); }
        .slot.space { border: none; background: transparent; width: 15px; cursor: default; }
        
        .slot.correct-anim { border-color: #22c55e; color: #15803d; background: #dcfce7; box-shadow: 0 2px 0 #16a34a; }
        .slot.wrong-anim { border-color: #ef4444; color: #b91c1c; background: #fee2e2; box-shadow: 0 2px 0 #b91c1c; }

        .letters-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; min-height: 50px; }
        .letter-chip { width: 45px; height: 50px; background: white; border: 2px solid #c4b5fd; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; font-family: 'Fredoka One', sans-serif; color: var(--dark); cursor: pointer; box-shadow: 0 4px 0 #ddd6fe; transition: 0.1s; user-select: none; text-transform: lowercase; }
        .letter-chip:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        .letter-chip.used { opacity: 0; pointer-events: none; transform: scale(0.8); }

        .primary-btn { width: 100%; background: var(--main); color: white; font-weight: 800; font-size: 18px; padding: 15px; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 var(--dark); margin-top: 10px; transition: 0.1s; }
        .primary-btn:active { transform: translateY(4px); box-shadow: none; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(245,243,255,0.9); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 20px; text-align: center; width: 100%; max-width: 320px; border: 4px solid var(--main); box-shadow: 0 10px 25px rgba(139,92,246,0.2); }
        .modal-box input { width: 100%; padding: 10px; margin-bottom: 12px; border: 2px solid #c4b5fd; border-radius: 10px; text-align: center; font-family: 'Sarabun'; font-size: 16px; outline: none; }
    </style>
</head>
<body>

    <div id="userProfile" class="profile-bar hidden">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับ</button>
    </div>

    <div class="container" id="gameContainer">
        <h1>It's fun! Vocab</h1>
        <div class="progress-text" id="progressText">ข้อ 1 / 10</div>
        <div class="hint-text" id="hintText">คำแปลภาษาไทย</div>

        <button class="audio-btn" onclick="playCurrentAudio()">
            <span>🔊</span> <span>ฟังเสียงคำศัพท์</span>
        </button>

        <div class="slots-container" id="slotsContainer"></div>
        <div class="letters-container" id="lettersContainer"></div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 style="color:var(--dark); font-size: 22px; margin-top:0;">📝 ลงชื่อเข้าเรียน</h2>
            <input type="text" id="in_name" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="primary-btn" onclick="confirmUser()">เริ่มทำแบบฝึกหัด</button>
        </div>
    </div>

    <!-- Score Modal -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark); font-size: 24px; margin-top:0;">🎉 ทำเสร็จแล้ว!</h2>
            <p style="color: #64748b; font-weight: bold;">คะแนนของคุณคือ</p>
            <div style="font-size: 50px; font-weight: 900; color: var(--main); margin: 10px 0;"><span id="finalScore">0</span> / 10</div>
            <div id="saveStatus" style="font-weight:bold; color:#15803d; margin-bottom: 15px;"></div>
            <button class="primary-btn" onclick="location.reload()">🔄 เล่นอีกครั้ง</button>
        </div>
    </div>

    <script>
        const TOPIC_NAME = "ม.1 Unit 6 It's fun Vocap";
        const vocabList = [
            { word: "fish", th: "ตกปลา", audio: "fish.mp3" },
            { word: "ski", th: "เล่นสกี", audio: "ski.mp3" },
            { word: "sunbathe", th: "อาบแดด", audio: "sunbathe.mp3" },
            { word: "swim", th: "ว่ายน้ำ", audio: "swim.mp3" },
            { word: "windsurf", th: "เล่นวินด์เซิร์ฟ", audio: "windsurf.mp3" },
            { word: "golf", th: "กีฬากอล์ฟ", audio: "golf.mp3" },
            { word: "Greece", th: "ประเทศกรีซ", audio: "Greece.mp3" },
            { word: "hotel", th: "โรงแรม", audio: "hotel.mp3" },
            { word: "play golf", th: "ตีกอล์ฟ / เล่นกอล์ฟ", audio: "play_golf.mp3" },
            { word: "read a book", th: "อ่านหนังสือ", audio: "read_a_book.mp3" }
        ];

        let currentIdx = 0;
        let score = 0;
        let currentWord = "";
        let audioPlayer = new Audio();
        let isChecking = false;
        
        window.onload = () => { 
            if(!localStorage.getItem('studentId')) {
                document.getElementById('loginModal').classList.add('active');
            } else {
                checkLogin();
                initGame();
            }
        };

        function checkLogin() {
            document.getElementById('userProfile').classList.remove('hidden');
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        }

        function switchAccount() {
            localStorage.clear();
            document.getElementById('userProfile').classList.add('hidden');
            document.getElementById('loginModal').classList.add('active');
        }

        // วางโค้ด Auto ชั้นเรียนไว้ตรงนี้ได้เลย
        document.getElementById('in_room').addEventListener('blur', function() {
            let val = this.value.trim();
            val = val.replace(/ม\.?/g, '').trim(); 
            let nums = val.match(/\d+/g);
            
            if (nums && nums.length >= 2) {
                this.value = `ม.${nums[0]}/${nums[1]}`;
            } else if (nums && nums.length === 1) {
                this.value = `ม.1/${nums[0]}`;
            }
        });
        
        function confirmUser() {
            let n = document.getElementById('in_name').value.trim();
            let r = document.getElementById('in_room').value.trim();
            let id = document.getElementById('in_id').value.trim();
            if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกให้ครบ และรหัสนักเรียน 5 หลัก', 'warning'); return; }
            
            localStorage.setItem('studentName', n); 
            localStorage.setItem('studentRoom', r); 
            localStorage.setItem('studentId', id);
            document.getElementById('loginModal').classList.remove('active');
            checkLogin();
            initGame();
        }

        function initGame() {
            currentIdx = 0;
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            isChecking = false;
            const data = vocabList[currentIdx];
            currentWord = data.word;
            audioPlayer.src = './' + data.audio;
            
            document.getElementById('progressText').innerText = `ข้อ ${currentIdx + 1} / ${vocabList.length}`;
            document.getElementById('hintText').innerText = data.th;
            
            const slotsContainer = document.getElementById('slotsContainer');
            slotsContainer.innerHTML = '';
            
            let lettersOnly = [];
            
            for(let i=0; i<currentWord.length; i++) {
                let char = currentWord[i];
                if(char === ' ') {
                    let space = document.createElement('div');
                    space.className = 'slot space';
                    slotsContainer.appendChild(space);
                } else {
                    lettersOnly.push(char);
                    let slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.dataset.expected = char.toLowerCase();
                    slot.dataset.filledId = "";
                    slot.onclick = () => returnLetter(slot);
                    slotsContainer.appendChild(slot);
                }
            }

            lettersOnly = lettersOnly.sort(() => Math.random() - 0.5);
            
            const lettersContainer = document.getElementById('lettersContainer');
            lettersContainer.innerHTML = '';
            
            lettersOnly.forEach((char, index) => {
                let chip = document.createElement('div');
                chip.className = 'letter-chip';
                chip.innerText = char;
                chip.id = `chip-${index}`;
                chip.onclick = () => placeLetter(chip);
                lettersContainer.appendChild(chip);
            });
        }

        function playCurrentAudio() {
            audioPlayer.play();
        }

        function placeLetter(chip) {
            if(chip.classList.contains('used') || isChecking) return;
            
            const slots = document.querySelectorAll('.slot:not(.space)');
            let targetSlot = null;
            for(let slot of slots) {
                if(slot.innerText === "") {
                    targetSlot = slot;
                    break;
                }
            }
            
            if(targetSlot) {
                targetSlot.innerText = chip.innerText;
                targetSlot.dataset.filledId = chip.id;
                targetSlot.classList.add('filled');
                chip.classList.add('used');
                checkAnswer();
            }
        }

        function returnLetter(slot) {
            if(slot.innerText === "" || isChecking) return;
            
            let chipId = slot.dataset.filledId;
            let chip = document.getElementById(chipId);
            if(chip) chip.classList.remove('used');
            
            slot.innerText = "";
            slot.dataset.filledId = "";
            slot.classList.remove('filled');
        }

        function checkAnswer() {
            const slots = document.querySelectorAll('.slot:not(.space)');
            let currentAnswer = "";
            let isFull = true;
            
            slots.forEach(slot => {
                if(slot.innerText === "") isFull = false;
                currentAnswer += slot.innerText;
            });
            
            if(!isFull) return;
            
            isChecking = true;
            let expectedWord = currentWord.replace(/ /g, '').toLowerCase();
            
            if(currentAnswer.toLowerCase() === expectedWord) {
                score++;
                slots.forEach(slot => slot.classList.add('correct-anim'));
                playCorrectSound();
            } else {
                slots.forEach(slot => {
                    slot.classList.add('wrong-anim');
                    // แสดงเฉลยที่ถูกต้อง
                    slot.innerText = slot.dataset.expected;
                });
                playWrongSound();
            }

            setTimeout(() => {
                currentIdx++;
                if(currentIdx < vocabList.length) {
                    loadQuestion();
                } else {
                    finishGame();
                }
            }, 1500);
        }

        function finishGame() {
            document.getElementById('scoreModal').classList.add('active');
            document.getElementById('finalScore').innerText = score;

            const stat = document.getElementById('saveStatus');
            if(typeof QUIZ_CONFIG === 'undefined') { stat.innerText = "❌ ไม่พบการเชื่อมต่อ Sheet"; return; }

            stat.innerText = "⏳ กำลังส่งคะแนน...";
            fetch(QUIZ_CONFIG.SCRIPT_URL, { 
                method: 'POST', mode: 'no-cors', 
                body: JSON.stringify({ 
                    name: localStorage.getItem('studentName'), 
                    room: localStorage.getItem('studentRoom'), 
                    studentId: "'"+localStorage.getItem('studentId'), 
                    lesson: TOPIC_NAME, 
                    score: score, 
                    maxScore: vocabList.length 
                }) 
            }).catch(e=>{});

            setTimeout(() => { stat.innerText = "✅ บันทึกคะแนนเรียบร้อย!"; }, 1500);
        }

        // Web Audio API สำหรับสร้างเสียง
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, duration, type = "sine") {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            osc.type = type;
            osc.start();
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }
        function playCorrectSound() {
            playBeep(523.25, 0.1); // C5
            setTimeout(() => playBeep(659.25, 0.2), 100); // E5
        }
        function playWrongSound() {
            playBeep(250, 0.3, "sawtooth"); 
        }
    </script>
</body>
</html>
