<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothes Vocab Flipcard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    
    <style>
        :root { --main: #0ea5e9; --dark: #0284c7; }
        body { 
            font-family: 'Sarabun', sans-serif; 
            margin: 0; padding: 15px; 
            background: #f0f9ff;
            min-height: 100vh;
        }
        
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        
        h1 { font-family: 'Fredoka One', cursive; color: var(--main); text-align: center; font-size: 26px; margin: 5px 0 15px 0; }
        
        .profile-bar { font-size: 14px; background: #e0f2fe; border: 2px solid #bae6fd; padding: 8px 15px; border-radius: 20px; color: var(--dark); font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; }
        .btn-switch { background: #fca5a5; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        .progress-indicator { text-align: center; font-size: 16px; font-weight: bold; color: #64748b; margin-bottom: 20px; }

        /* Flipcard Grid & Animation */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            justify-content: center;
        }
        @media (max-width: 400px) {
            .card-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .flip-card {
            background-color: transparent;
            width: 100%;
            aspect-ratio: 1 / 1.2;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid #bae6fd;
            padding: 10px;
        }

        .flip-card-front {
            background-color: white;
        }
        
        .flip-card-front img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        .flip-card-back {
            background: linear-gradient(135deg, #0ea5e9, #38bdf8);
            color: white;
            transform: rotateY(180deg);
            border-color: #0284c7;
        }

        .vocab-word {
            font-family: 'Fredoka One', cursive;
            font-size: 18px;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .audio-icon {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-top: 5px;
        }

        .primary-btn { width: 100%; background: var(--main); color: white; font-weight: 800; font-size: 18px; padding: 15px; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 var(--dark); margin-top: 25px; transition: 0.1s; display: none; }
        .primary-btn:active { transform: translateY(4px); box-shadow: none; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 20px; text-align: center; width: 100%; max-width: 320px; border: 4px solid var(--main); }
        .modal-box input { width: 100%; padding: 10px; margin-bottom: 12px; border: 2px solid #7dd3fc; border-radius: 10px; text-align: center; font-family: 'Sarabun'; font-size: 16px; outline: none; }
    </style>
</head>
<body>
    
    <div id="userProfile" class="profile-bar hidden">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับ</button>
    </div>

    <div class="container" id="gameContainer">
        <h1>🎒 Clothes Vocab Flipcard</h1>
        
        <div class="progress-indicator" id="progressIndicator">เปิดการ์ด: 0 / 11</div>

        <div class="card-grid" id="cardGrid"></div>

        <button class="primary-btn" id="finishBtn" onclick="finishGame()">✅ บันทึกคะแนน</button>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 style="color:var(--dark); font-size: 22px; margin-top:0;">📝 ลงชื่อเข้าเรียน</h2>
            <input type="text" id="in_name" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="primary-btn" style="display: block; width: 100%; margin-top: 10px;" onclick="confirmUser()">เริ่มเรียนรู้</button>
        </div>
    </div>

    <!-- Score Modal -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark); font-size: 24px; margin-top:0;">🎉 ยอดเยี่ยมมาก!</h2>
            <div style="font-size: 16px; color: #475569; margin: 10px 0;">เปิดการ์ดครบ 11 ใบแล้ว</div>
            <div id="saveStatus" style="font-weight:bold; color:#15803d; margin-bottom: 15px;"></div>
            <button class="primary-btn" style="display: block; width: 100%; margin-top: 10px;" onclick="location.reload()">🔄 เล่นอีกครั้ง</button>
        </div>
    </div>

    <script>
        const TOPIC_NAME = "ม.1 Unit 6 Clothes Vocab Flipcard";
        
        // ข้อมูลการ์ดทั้ง 11 ใบ
        const vocabList = [
            { id: "boots", word: "boots", img: "boots.jpg", audio: "boots.mp3" },
            { id: "hat_gloves", word: "hat and gloves", img: "hat_gloves.jpg", audio: "hat_gloves.mp3" },
            { id: "jacket", word: "jacket", img: "jacket.jpg", audio: "jacket.mp3" },
            { id: "jeans", word: "jeans", img: "jeans.jpg", audio: "jeans.mp3" },
            { id: "long_shirt", word: "long-sleeved shirt", img: "long-sleeved_shirt.jpg", audio: "long-sleeved_shirt.mp3" },
            { id: "shorts", word: "shorts", img: "shorts.jpg", audio: "shorts.mp3" },
            { id: "short_shirt", word: "short-sleeved shirt", img: "short-sleeved_shirt.jpg", audio: "short-sleeved_shirt.mp3" },
            { id: "suitcase", word: "suitcase", img: "suitcase.jpg", audio: "suitcase.mp3" },
            { id: "sweater", word: "woollen sweater", img: "sweater.jpg", audio: "sweater.mp3" },
            { id: "walking_shoes", word: "walking shoes", img: "walking_shoes.jpg", audio: "walking_shoes.mp3" },
            { id: "winter_coat", word: "winter coat", img: "winter_coat.jpg", audio: "winter_coat.mp3" }
        ];

        let flippedCards = new Set();
        let currentAudio = null;

        window.onload = () => { 
            if(!localStorage.getItem('studentId')) document.getElementById('loginModal').classList.add('active');
            else { checkLogin(); startGame(); }
        };

        document.getElementById('in_room').addEventListener('blur', function() {
            let val = this.value.trim().replace(/ม\.?/g, '').trim(); 
            let nums = val.match(/\d+/g);
            if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
            else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
        });

        function checkLogin() {
            document.getElementById('userProfile').classList.remove('hidden');
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        }

        function switchAccount() {
            localStorage.clear();
            document.getElementById('userProfile').classList.add('hidden');
            document.getElementById('loginModal').classList.add('active');
        }

        function confirmUser() {
            let n = document.getElementById('in_name').value.trim();
            let r = document.getElementById('in_room').value.trim();
            let id = document.getElementById('in_id').value.trim();
            if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกให้ครบ และรหัส 5 หลัก', 'warning'); return; }
            localStorage.setItem('studentName', n); localStorage.setItem('studentRoom', r); localStorage.setItem('studentId', id);
            document.getElementById('loginModal').classList.remove('active');
            checkLogin(); startGame();
        }

        function startGame() {
            vocabList.sort(() => Math.random() - 0.5); // สุ่มตำแหน่งการ์ด
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';

            vocabList.forEach(item => {
                let card = document.createElement('div');
                card.className = "flip-card";
                card.innerHTML = `
                    <div class="flip-card-inner" id="inner-${item.id}">
                        <div class="flip-card-front">
                            <img src="${item.img}" alt="${item.word}" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                        </div>
                        <div class="flip-card-back">
                            <div class="vocab-word">${item.word}</div>
                            <div class="audio-icon">🔊</div>
                        </div>
                    </div>
                `;
                card.onclick = () => handleFlip(item);
                grid.appendChild(card);
            });
        }

        function handleFlip(item) {
            const cardInner = document.getElementById(`inner-${item.id}`).parentElement;
            
            // เปิดหรือปิดการ์ด
            cardInner.classList.toggle('flipped');

            if (cardInner.classList.contains('flipped')) {
                // เล่นเสียงเมื่อหงายการ์ด
                playAudio(item.audio);
                flippedCards.add(item.id);
                updateProgress();
            }
        }

        function playAudio(audioSrc) {
            if(currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            currentAudio = new Audio(audioSrc);
            currentAudio.play().catch(e => console.log("Audio not found yet."));
        }

        function updateProgress() {
            document.getElementById('progressIndicator').innerText = `เปิดการ์ด: ${flippedCards.size} / ${vocabList.length}`;
            if (flippedCards.size === vocabList.length) {
                document.getElementById('finishBtn').style.display = 'block';
            }
        }

        function finishGame() {
            document.getElementById('scoreModal').classList.add('active');
            const stat = document.getElementById('saveStatus');
            if(typeof QUIZ_CONFIG === 'undefined') { stat.innerText = "❌ ไม่พบการเชื่อมต่อ Sheet"; return; }
            stat.innerText = "⏳ กำลังส่งข้อมูล...";
            
            // เก็บเป็น 11/11 คะแนน
            fetch(QUIZ_CONFIG.SCRIPT_URL, { 
                method: 'POST', mode: 'no-cors', 
                body: JSON.stringify({ 
                    name: localStorage.getItem('studentName'), 
                    room: localStorage.getItem('studentRoom'), 
                    studentId: "'"+localStorage.getItem('studentId'), 
                    lesson: TOPIC_NAME, 
                    score: flippedCards.size, 
                    maxScore: vocabList.length 
                }) 
            }).catch(e=>{});
            setTimeout(() => { stat.innerText = "✅ บันทึกข้อมูลการเรียนรู้เรียบร้อย!"; }, 1500);
        }
    </script>
</body>
</html>
