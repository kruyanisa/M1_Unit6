
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alaska: Pack Your Suitcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    
    <style>
        :root { --main: #0ea5e9; --dark: #0284c7; }
        body { 
            font-family: 'Sarabun', sans-serif; 
            margin: 0; padding: 15px; 
            background: url('bg_alaska.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }
        /* Overlay เพื่อให้ข้อความอ่านง่ายขึ้น */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); z-index: -1; }
        
        .container { max-width: 700px; margin: 0 auto; background: rgba(255,255,255,0.95); border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .hidden { display: none !important; }
        
        h1 { font-family: 'Fredoka One', cursive; color: var(--main); text-align: center; font-size: 26px; margin: 5px 0 15px 0; text-shadow: 1px 1px 0px white; }
        
        .profile-bar { font-size: 14px; background: #e0f2fe; border: 2px solid #bae6fd; padding: 8px 15px; border-radius: 20px; color: var(--dark); font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; }
        .btn-switch { background: #fca5a5; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        .audio-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 250px; margin: 0 auto 15px auto; background: #fbbf24; color: #b45309; font-weight: bold; padding: 10px; border-radius: 20px; cursor: pointer; border: none; font-size: 16px; box-shadow: 0 4px 0 #d97706; transition: 0.1s; }
        .audio-btn:active { transform: translateY(4px); box-shadow: none; }

        .season-title { text-align: center; font-size: 22px; font-weight: 800; color: #1e293b; background: #fef08a; padding: 10px; border-radius: 12px; border: 2px dashed #ca8a04; margin-bottom: 20px; }
        
        /* กระเป๋าเดินทาง (ใช้เป็นพื้นหลัง 16:9) */
        .suitcase-area {
            background: url('suitcase.jpg') no-repeat center center;
            background-size: cover;
            border-radius: 12px;
            min-height: 200px;
            padding: 15px;
            margin-bottom: 20px;
            border: 4px solid #854d0e;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
            align-content: start;
        }

        /* ตู้เสื้อผ้า */
        .wardrobe-area {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 15px;
            min-height: 120px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .clothing-item {
            width: 100%; aspect-ratio: 1/1; 
            background: white; border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            cursor: pointer; transition: 0.2s;
            border: 2px solid transparent;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .clothing-item img { width: 90%; height: 90%; object-fit: contain; }
        .clothing-item:active { transform: scale(0.9); }
        .clothing-item.in-suitcase { border-color: #22c55e; }

        .primary-btn { width: 100%; background: var(--main); color: white; font-weight: 800; font-size: 18px; padding: 15px; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 var(--dark); margin-top: 10px; transition: 0.1s; }
        .primary-btn:active { transform: translateY(4px); box-shadow: none; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 20px; text-align: center; width: 100%; max-width: 320px; border: 4px solid var(--main); }
        .modal-box input { width: 100%; padding: 10px; margin-bottom: 12px; border: 2px solid #7dd3fc; border-radius: 10px; text-align: center; font-family: 'Sarabun'; font-size: 16px; outline: none; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    
    <div id="userProfile" class="profile-bar hidden">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับ</button>
    </div>

    <div class="container" id="gameContainer">
        <h1>Alaska: Pack Your Suitcase</h1>
        
        <button class="audio-btn" onclick="playArticleAudio()">
            <span>🔊</span> <span>ฟังบทความ Alaska</span>
        </button>

        <div class="season-title" id="seasonDisplay">ฤดูกาล...</div>

        <div style="font-weight: bold; color: #475569; margin-bottom: 5px;">🎒 Your Suitcase (แตะเสื้อผ้าเพื่อหยิบเข้า/ออก)</div>
        <div class="suitcase-area" id="suitcaseGrid"></div>

        <div style="font-weight: bold; color: #475569; margin-bottom: 5px;">👕 Wardrobe</div>
        <div class="wardrobe-area" id="wardrobeGrid"></div>

        <button class="primary-btn" id="checkBtn" onclick="checkPacking()">✅ จัดกระเป๋าเสร็จแล้ว!</button>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 style="color:var(--dark); font-size: 22px; margin-top:0;">📝 ลงชื่อเข้าเรียน</h2>
            <input type="text" id="in_name" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="primary-btn" onclick="confirmUser()">เริ่มจัดกระเป๋า</button>
        </div>
    </div>

    <!-- Score Modal -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark); font-size: 24px; margin-top:0;">🎉 ยอดเยี่ยมมาก!</h2>
            <div style="font-size: 50px; font-weight: 900; color: var(--main); margin: 10px 0;"><span id="finalScore">0</span> / 4</div>
            <div id="saveStatus" style="font-weight:bold; color:#15803d; margin-bottom: 15px;"></div>
            <button class="primary-btn" onclick="location.reload()">🔄 เล่นอีกครั้ง</button>
        </div>
    </div>

    <script>
        const TOPIC_NAME = "ม.1 Unit 6 Culture Alaska travel";
        
        // ข้อมูลเสื้อผ้าและไฟล์ภาพ 1:1 .jpg
        const allClothes = [
            { id: "short_shirt", img: "short-sleeved_shirt.jpg" },
            { id: "long_shirt", img: "long-sleeved_shirt.jpg" },
            { id: "hat_gloves", img: "hat_gloves.jpg" },
            { id: "walking_shoes", img: "walking_shoes.jpg" },
            { id: "boots", img: "boots.jpg" },
            { id: "jacket", img: "jacket.jpg" },
            { id: "sweater", img: "sweater.jpg" },
            { id: "winter_coat", img: "winter_coat.jpg" }
        ];

        // โจทย์แต่ละฤดู (อิงตามตาราง)
        const seasons = [
            { name: "Winter (ฤดูหนาว)", req: ["hat_gloves", "boots", "sweater", "winter_coat"] },
            { name: "Spring (ฤดูใบไม้ผลิ)", req: ["long_shirt", "hat_gloves", "boots", "jacket", "sweater"] },
            { name: "Summer (ฤดูร้อน)", req: ["short_shirt", "long_shirt", "walking_shoes", "jacket"] },
            { name: "Autumn (ฤดูใบไม้ร่วง)", req: ["long_shirt", "hat_gloves", "walking_shoes", "boots", "jacket", "sweater"] }
        ];

        let currentSeasonIdx = 0;
        let score = 0;
        let packedItems = [];
        let articleAudio = new Audio('alaska.mp3');

        window.onload = () => { 
            if(!localStorage.getItem('studentId')) document.getElementById('loginModal').classList.add('active');
            else { checkLogin(); startGame(); }
        };

        // --- Auth & Auto Room ---
        document.getElementById('in_room').addEventListener('blur', function() {
            let val = this.value.trim().replace(/ม\.?/g, '').trim(); 
            let nums = val.match(/\d+/g);
            if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
            else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
        });

        function checkLogin() {
            document.getElementById('userProfile').classList.remove('hidden');
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        }

        function switchAccount() {
            localStorage.clear();
            document.getElementById('userProfile').classList.add('hidden');
            document.getElementById('loginModal').classList.add('active');
        }

        function confirmUser() {
            let n = document.getElementById('in_name').value.trim();
            let r = document.getElementById('in_room').value.trim();
            let id = document.getElementById('in_id').value.trim();
            if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกให้ครบ และรหัส 5 หลัก', 'warning'); return; }
            localStorage.setItem('studentName', n); localStorage.setItem('studentRoom', r); localStorage.setItem('studentId', id);
            document.getElementById('loginModal').classList.remove('active');
            checkLogin(); startGame();
        }

        // --- Game Logic ---
        function startGame() {
            // สุ่มลำดับฤดู
            seasons.sort(() => Math.random() - 0.5);
            currentSeasonIdx = 0;
            score = 0;
            loadSeason();
        }

        function loadSeason() {
            packedItems = [];
            document.getElementById('seasonDisplay').innerText = `🌍 จัดกระเป๋าสำหรับ: ${seasons[currentSeasonIdx].name}`;
            renderClothes();
        }

        function renderClothes() {
            const wardrobe = document.getElementById('wardrobeGrid');
            const suitcase = document.getElementById('suitcaseGrid');
            wardrobe.innerHTML = ''; suitcase.innerHTML = '';

            allClothes.forEach(item => {
                let div = document.createElement('div');
                div.className = `clothing-item ${packedItems.includes(item.id) ? 'in-suitcase' : ''}`;
                div.innerHTML = `<img src="${item.img}" alt="clothes" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">`;
                div.onclick = () => toggleItem(item.id);
                
                if (packedItems.includes(item.id)) suitcase.appendChild(div);
                else wardrobe.appendChild(div);
            });
        }

        function toggleItem(id) {
            playPopSound();
            if (packedItems.includes(id)) {
                packedItems = packedItems.filter(i => i !== id); // เอาออก
            } else {
                packedItems.push(id); // หยิบใส่
            }
            renderClothes();
        }

        function checkPacking() {
            let req = seasons[currentSeasonIdx].req;
            // เช็คว่าจัดของถูกเป๊ะไหม (จำนวนเท่ากันและของตรงกัน)
            let isCorrect = req.length === packedItems.length && req.every(i => packedItems.includes(i));

            if (isCorrect) {
                score++;
                playCorrectSound();
                Swal.fire({ title: 'ถูกต้อง!', text: 'จัดกระเป๋าได้เยี่ยมมาก', icon: 'success', timer: 1500, showConfirmButton: false }).then(nextSeason);
            } else {
                playWrongSound();
                Swal.fire({ title: 'ยังไม่เป๊ะ!', text: 'ลองดูตารางอีกทีว่าฤดูนี้ต้องเตรียมอะไรบ้างนะ', icon: 'error', confirmButtonText: 'จัดใหม่' });
            }
        }

        function nextSeason() {
            currentSeasonIdx++;
            if(currentSeasonIdx < seasons.length) loadSeason();
            else finishGame();
        }

        function finishGame() {
            document.getElementById('scoreModal').classList.add('active');
            document.getElementById('finalScore').innerText = score;
            const stat = document.getElementById('saveStatus');
            if(typeof QUIZ_CONFIG === 'undefined') { stat.innerText = "❌ ไม่พบการเชื่อมต่อ Sheet"; return; }
            stat.innerText = "⏳ กำลังส่งคะแนน...";
            fetch(QUIZ_CONFIG.SCRIPT_URL, { 
                method: 'POST', mode: 'no-cors', 
                body: JSON.stringify({ name: localStorage.getItem('studentName'), room: localStorage.getItem('studentRoom'), studentId: "'"+localStorage.getItem('studentId'), lesson: TOPIC_NAME, score: score, maxScore: seasons.length }) 
            }).catch(e=>{});
            setTimeout(() => { stat.innerText = "✅ บันทึกคะแนนเรียบร้อย!"; }, 1500);
        }

        function playArticleAudio() { articleAudio.play(); }

        // --- Web Audio API Sounds ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, duration, type="sine") {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = freq; osc.type = type;
            osc.start();
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }
        function playPopSound() { playBeep(400, 0.1); }
        function playCorrectSound() { playBeep(523.25, 0.1); setTimeout(() => playBeep(659.25, 0.2), 100); }
        function playWrongSound() { playBeep(250, 0.3, "sawtooth"); }
    </script>
</body>
</html>
